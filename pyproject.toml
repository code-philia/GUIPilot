[project]
name = "guipilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adbutils>=2.12.0",
    "aiohttp>=3.13.5",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "matplotlib>=3.10.8",
    "mitmproxy>=12.2.2",
    "openai>=2.32.0",
    "opencv-python>=4.13.0.92",
    "paddleocr>=3.4.1",
    "paddlepaddle-gpu>=3.3.1",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "supervision>=0.27.0.post2",
    "textual>=8.2.4",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "uiautomator2>=3.5.0",
    "ultralytics>=8.4.41",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "paddlepaddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
paddlepaddle-gpu = [{ index = "paddlepaddle-cu126" }]
