name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  static-checks:
    name: Static checks & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda and create environment from environment.yml
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          environment-file: environment.yml
          activate-environment: guipilot
          python-version: 3.12

      - name: Install project (editable) and upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Install static analysis tools
        run: |
          pip install flake8 mypy pylint bandit

      - name: Run flake8
        run: |
          python -m flake8 guipilot --max-line-length=88 --exclude=build,dist,venv,__pycache__

      - name: Run mypy
        run: |
          python -m mypy guipilot --ignore-missing-imports --pretty

      - name: Run pylint (non-blocking)
        run: |
          # pylint can be noisy; keep job green but still show output
          python -m pylint guipilot --output-format=text || true

      - name: Run bandit (security scan, non-blocking)
        run: |
          python -m bandit -r guipilot -lll -f txt || true
