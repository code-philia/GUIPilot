name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (pytest) - Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('**/setup.py','**/environment.yml','**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Upgrade pip and install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,dev]
      - name: Run tests
        run: |
          coverage run -m pytest -q --maxfail=1
          coverage report
        env:
          PYTHONWARNINGS: "ignore::DeprecationWarning"
          DATASET_PATH: "./datasets/new"
          PYTHONPATH: "."

  end2end:
    name: End-to-end Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (3.12)
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('**/setup.py','**/environment.yml','**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Upgrade pip and install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Make end2end script executable
        run: |
          chmod +x tests/run_end2end.sh || true

      - name: Run end-to-end script
        run: |
          ./tests/run_end2end.sh

  lint:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (3.12)
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('**/setup.py','**/environment.yml','**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Do lint check
        run: |
          bash lint_check.sh
